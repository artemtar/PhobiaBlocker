<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PhobiaBlocker</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/popup.css">
</head>

<body>
    <header class="pb-header">
        <span class="pb-wordmark">
            <span class="pb-wordmark-mark" aria-hidden="true">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3l7 3v5c0 4.4-2.9 8.4-7 9.6-4.1-1.2-7-5.2-7-9.6V6l7-3z"/>
                </svg>
            </span>
            PhobiaBlocker
        </span>
        <button id="open-settings-btn" class="pb-icon-btn" title="Settings" aria-label="Settings">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.37.4.68.74.88H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
        </button>
    </header>

    <main class="pb-body">
        <div id="site-status-bar" class="site-status-bar" role="status"></div>

        <div class="pb-tiles">
            <label class="pb-tile" title="Scans page text for words that trigger your phobias using intelligent word matching.">
                <input type="checkbox" id="enabled-switch">
                <span class="pb-tile-icon" aria-hidden="true">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </span>
                <span class="pb-tile-label">Smart<br>detection</span>
                <span class="pb-tile-state"></span>
            </label>

            <label class="pb-tile" title="Skip text analysis and blur all visual content for maximum protection.">
                <input type="checkbox" id="blurIsAlwaysOn-switch">
                <span class="pb-tile-icon" aria-hidden="true">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3s6 6.1 6 10a6 6 0 0 1-12 0c0-3.9 6-10 6-10z"/>
                    </svg>
                </span>
                <span class="pb-tile-label">Always<br>blur</span>
                <span class="pb-tile-state"></span>
            </label>

            <label class="pb-tile" title="Cover matching trigger words on web pages. Use right-click Unblur or Unblur all to reveal them.">
                <input type="checkbox" id="wordCoverEnabled-switch">
                <span class="pb-tile-icon" aria-hidden="true">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 7V5h16v2M9 19h6M12 5v14"/>
                    </svg>
                </span>
                <span class="pb-tile-label">Cover<br>words</span>
                <span class="pb-tile-state"></span>
            </label>
        </div>

        <div class="pb-actions">
            <button class="pb-btn pb-btn-primary" id="blurBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M17.9 17.9A10.6 10.6 0 0 1 12 20c-7 0-11-8-11-8a19.5 19.5 0 0 1 5.1-6M9.9 4.2A10.6 10.6 0 0 1 12 4c7 0 11 8 11 8a19.5 19.5 0 0 1-2.2 3.2M1 1l22 22"/>
                </svg>
                <span>Blur all</span>
            </button>
            <button class="pb-btn" id="unblurBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
                <span>Unblur all</span>
            </button>
        </div>

        <section class="pb-section">
            <div class="pb-section-head">
                <span class="pb-section-title">
                    Blur amount
                    <span class="info-icon" data-tooltip="Adjust the intensity of the blur applied to visual content.">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
                            <circle cx="8" cy="8" r="6.5"/>
                            <path d="M8 7.2v4M8 4.9v.9" stroke-linecap="round"/>
                        </svg>
                    </span>
                </span>
                <span id="blurRangeValue" class="pb-section-value">50%</span>
            </div>
            <input type="range" id="blurRange" class="pb-range" min="0" max="100" step="1" aria-label="Blur amount">
        </section>

        <section class="pb-section">
            <div class="pb-section-head">
                <span class="pb-section-title">
                    Trigger words
                    <span id="trigger-count-badge" class="count-badge" style="display:none"></span>
                    <span class="info-icon" data-tooltip="Words related to your phobias that trigger content blurring.">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
                            <circle cx="8" cy="8" r="6.5"/>
                            <path d="M8 7.2v4M8 4.9v.9" stroke-linecap="round"/>
                        </svg>
                    </span>
                </span>
                <span name="supportedWords" id="btn-supported-words" class="pb-collapse-btn" role="button" tabindex="0" aria-label="Toggle trigger words"></span>
            </div>
            <div id="supported-words-area" class="collapse">
                <div id="tags-container" class="tags-container"></div>
                <div class="add-word-input-container">
                    <input type="text" id="word-input" class="pb-input word-input" placeholder="Add a word" maxlength="30">
                    <button id="addTagBtn" class="add-word-btn" title="Add word" aria-label="Add word">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                            <path d="M8 3V13M3 8H13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>
                <p id="word-error" class="word-error" role="alert" hidden></p>
            </div>
        </section>

        <section id="detected-words-container" class="pb-section">
            <div class="pb-section-head">
                <span class="pb-section-title">
                    Detected on this page
                    <span id="detected-count-badge" class="count-badge" style="display:none"></span>
                    <span class="info-icon" data-tooltip="Trigger words currently detected in this page's text.">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
                            <circle cx="8" cy="8" r="6.5"/>
                            <path d="M8 7.2v4M8 4.9v.9" stroke-linecap="round"/>
                        </svg>
                    </span>
                </span>
                <span id="btn-detected-words" class="pb-collapse-btn" role="button" tabindex="0" aria-label="Toggle detected words"></span>
            </div>
            <div id="detected-words-area" class="collapse">
                <div id="detected-words-list"></div>
            </div>
        </section>
    </main>

    <script src="js/shared-policy.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/popup.js"></script>
</body>
</html>
