<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reel Background Overlay Hover Test</title>
    <style>
        .feed-card {
            position: relative;
            width: 360px;
            margin: 24px;
        }

        .media-shell {
            position: relative;
            width: 360px;
            height: 450px;
        }

        .poster {
            width: 100%;
            height: 100%;
            background-image: url('https://via.placeholder.com/360x450/882222/ffffff?text=Spider+Reel');
            background-size: cover;
            background-position: center;
        }

        .full-card-link {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: block;
        }
    </style>
</head>
<body>
    <article class="feed-card">
        <p>This reel card mentions a spider, so the poster should be blurred.</p>
        <div class="media-shell">
            <div id="reel-poster" class="poster" aria-label="Spider reel poster"></div>
        </div>
        <a id="reel-overlay" class="full-card-link" href="#" aria-label="Open reel"></a>
    </article>
</body>
</html>
