<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page - Bumble-style Bg Overlay</title>
    <style>
        .card {
            display: inline-block;
            position: relative;
            width: 300px;
            height: 200px;
            border: 1px solid #ccc;
        }
        picture.media-box__picture {
            display: block;
            position: relative;
            width: 100%;
            height: 100%;
            margin: 0;
        }
        img.media-box__picture-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .face-capture-source {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2; /* sits on top of the <img> */
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body>
    <h1>Bumble-style overlay test</h1>
    <p>This page mentions spider so the extension should blur the image when spider is a target word.</p>

    <div class="card">
        <picture class="media-box__picture" id="bumble-picture">
            <img
                id="bumble-img"
                class="media-box__picture-image"
                width="300"
                height="200"
                src="https://via.placeholder.com/300x200/ff0000/ffffff?text=Spider"
                alt="Spider"
            >
            <div
                id="bumble-overlay"
                class="face-capture-source"
                role="presentation"
                style="background-image: url('https://via.placeholder.com/300x200/ff0000/ffffff?text=Spider');">
            </div>
        </picture>
    </div>
</body>
</html>
